<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlueBull CMS - Iniciar Sesión</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(13, 19, 33, 0.85);
      --primary: #00E5FF;
      --primary-hover: #00B2CC;
      --accent: #2979FF;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --error: #ff1744;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(41, 121, 255, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.1) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Ambient Glow Orbs */
    .glow-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, rgba(41, 121, 255, 0.05) 50%, transparent 100%);
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
    }
    
    .orb-1 {
      top: 15%;
      left: 15%;
      animation: float-1 20s infinite ease-in-out;
    }

    .orb-2 {
      bottom: 15%;
      right: 15%;
      animation: float-2 25s infinite ease-in-out;
    }

    @keyframes float-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.1); }
    }

    @keyframes float-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-30px, 40px) scale(0.9); }
    }

    /* Login Card Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(0, 229, 255, 0.05);
      text-align: center;
      transition: all 0.4s ease;
    }

    .login-card:hover {
      border-color: rgba(0, 229, 255, 0.3);
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(0, 229, 255, 0.1);
    }

    /* Logo & Branding */
    .logo-wrapper {
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      height: 70px;
      width: auto;
      filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.4));
      margin-bottom: 15px;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--text-white);
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-gray);
      margin-top: 5px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-gray);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text-white);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      background: rgba(11, 15, 25, 0.95);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: var(--text-white);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(41, 121, 255, 0.3);
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 6px 20px rgba(41, 121, 255, 0.4),
        0 0 15px rgba(0, 229, 255, 0.2);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: rgba(148, 163, 184, 0.2);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--text-white);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Notifications */
    .alert {
      background: rgba(255, 23, 68, 0.1);
      border: 1px solid rgba(255, 23, 68, 0.3);
      color: #ff8a80;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      text-align: left;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer Credits */
    .login-footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: var(--text-gray);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: var(--text-white);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      
      <!-- Logo -->
      <div class="logo-wrapper">
        <img src="https://bluebull.tech/assets/BBLogo-SVG-XcE_Odw1.svg" alt="BlueBull Logo" class="logo-img" />
        <h1 class="card-title">BlueBull Tech</h1>
        <p class="card-subtitle">Panel de Control & Soporte</p>
      </div>

      <!-- Alert Message -->
      <div id="alert-box" class="alert"></div>

      <!-- Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Corporativo</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input" placeholder="admin@bluebull.me" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required />
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <span>Acceder</span>
          <div id="spinner" class="spinner"></div>
        </button>
      </form>

      <!-- Footer -->
      <p class="login-footer">
        Protegido por Supabase Auth. <a href="/">Volver a BlueBull</a>
      </p>
    </div>
  </div>

  <!-- Supabase client JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Main Logic -->
  <script src="admin-login.js"></script>
</body>
</html>
